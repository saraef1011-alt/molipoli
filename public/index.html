<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولی پولی</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:radial-gradient(circle at top,#243b53,#0b1020);color:#fff;min-height:100vh}button,input{font:inherit}button{border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font-weight:700}.screen{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#111827ee;border:1px solid #ffffff18;border-radius:26px;padding:28px;box-shadow:0 20px 70px #0008}h1{font-size:48px;text-align:center;margin:8px}.sub{text-align:center;color:#aab5c7}.row{display:flex;gap:10px;margin:12px 0}.row>*{flex:1}input{width:100%;padding:13px;border-radius:13px;border:1px solid #334155;background:#0f172a;color:white}#game{display:none;padding:14px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.players{display:flex;gap:8px;overflow:auto;padding:10px 0}.player{background:#172033;border-radius:14px;padding:10px 14px;min-width:130px;border:2px solid transparent}.player.active{border-color:#facc15}.layout{display:grid;grid-template-columns:minmax(300px,760px) 300px;gap:14px;max-width:1200px;margin:auto}.board{aspect-ratio:1;background:#d9f99d;border:8px solid #422006;border-radius:22px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:3px;padding:5px;color:#111}.cell{background:#f8fafc;border:1px solid #64748b;border-radius:5px;padding:4px;font-size:10px;text-align:center;position:relative;overflow:hidden}.cell:nth-child(8n+1){background:#fde68a}.pawn{display:inline-block;border-radius:50%;width:15px;height:15px;margin:2px;border:2px solid white}.side{background:#111827;border-radius:20px;padding:16px}.log{height:220px;overflow:auto;background:#0b1220;border-radius:12px;padding:8px}.msg{margin:5px 0}.chatrow{display:flex;gap:6px;margin-top:8px}.chatrow input{flex:1}.dice{font-size:46px;text-align:center;padding:8px}.primary{background:#facc15;color:#111}.green{background:#22c55e;color:white}.danger{background:#ef4444;color:white}@media(max-width:850px){.layout{grid-template-columns:1fr}.board{max-width:650px;margin:auto}.side{order:-1}}
</style></head><body><section id="lobby" class="screen"><div class="card"><h1>🐭 مولی پولی</h1><p class="sub">نسخه آنلاین چندنفره با لابی، VS، چت و شروع خودکار</p><input id="name" placeholder="نام بازیکن"><div class="row"><input id="room" placeholder="کد اتاق (اختیاری)"><button class="primary" onclick="join()">ورود</button></div><p id="status" class="sub"></p></div></section><section id="game"><div class="top"><h2>🐭 مولی پولی</h2><div>اتاق: <b id="roomCode">-</b> | نوبت: <b id="turnName">-</b></div></div><div id="players" class="players"></div><div class="layout"><div><div id="board" class="board"></div><div class="row"><button id="ready" class="green" onclick="ready()">آماده‌ام</button><button id="roll" class="primary" onclick="roll()" disabled>🎲 تاس</button></div></div><aside class="side"><div class="dice" id="dice">🎲</div><h3>💬 چت</h3><div id="log" class="log"></div><div class="chatrow"><input id="chat" placeholder="پیام..."><button onclick="sendChat()">ارسال</button></div></aside></div></section><script src="/socket.io/socket.io.js"></script><script>const socket=io();let me=null,roomCode='';const $=id=>document.getElementById(id);function join(){let name=$('name').value.trim()||'بازیکن';let room=$('room').value.trim().toUpperCase();$('status').textContent='در حال ورود...';socket.emit('join',{name,room})}socket.on('joined',d=>{me=d.id;roomCode=d.room;$('roomCode').textContent=roomCode;$('lobby').style.display='none';$('game').style.display='block';});socket.on('errorMsg',m=>{$('status').textContent=m});socket.on('state',render);socket.on('dice',n=>{$('dice').textContent='🎲 '+n});socket.on('chat',m=>{let x=document.createElement('div');x.className='msg';x.textContent=m.name+': '+m.text;$('log').appendChild(x);$('log').scrollTop=$('log').scrollHeight});function ready(){socket.emit('ready');$('ready').textContent='آماده شد ✓'}function roll(){socket.emit('roll')}function sendChat(){let x=$('chat');if(x.value.trim())socket.emit('chat',x.value.trim());x.value=''}function render(s){let ps=s.players;let active=ps[s.turn%Math.max(ps.length,1)];$('turnName').textContent=active?.name||'-';$('players').innerHTML=ps.map(p=>`<div class="player ${active?.id===p.id?'active':''}" style="border-color:${p.color}"><b>${esc(p.name)}</b><br>🪙 ${p.money}<br>خانه: ${p.pos} ${p.ready?'✓':''}</div>`).join('');let cells=s.board;let order=[];for(let i=0;i<40;i++)order.push(i);$('board').innerHTML=order.map(i=>{let c=cells[i],owns=ps.filter(p=>c.owner===p.id);let pawns=ps.filter(p=>p.pos===i).map(p=>`<span class="pawn" style="background:${p.color}" title="${esc(p.name)}"></span>`).join('');return `<div class="cell"><b>${esc(c.name)}</b><br>${c.price?'🪙 '+c.price:''}<br>${owns.length?'👑':''}${pawns}</div>`}).join('');$('roll').disabled=!s.started||!active||active.id!==me}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
